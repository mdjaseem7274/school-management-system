<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="WSXUYiq1RCTmCvfsRStaAM8WBcuZBBnTjn0x9-SRE88" />
  <meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Delhi Public School | Portal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3f0;--sf:#fff;--ink:#14302a;--mut:#5b6f68;--ln:#d5e0db;--br:#1f5a47;--bi:#fff;--ac:#f2b705;--ok:#1d7a4f;--bad:#b3261e;--board:#17332b;--bd:#f2f1ea;
--hd:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;--tx:"Source Sans 3","Segoe UI",system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1d19;--sf:#172a24;--ink:#e8efeb;--mut:#9bb0a7;--ln:#2a4038;--br:#4fae8c;--bi:#0a1612;--ok:#58c58f;--bad:#ff8a80}}
:root[data-theme="dark"]{--bg:#0f1d19;--sf:#172a24;--ink:#e8efeb;--mut:#9bb0a7;--ln:#2a4038;--br:#4fae8c;--bi:#0a1612;--ok:#58c58f;--bad:#ff8a80}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 var(--tx);min-height:100vh}
h1,h2,h3{font-family:var(--hd);line-height:1.15}
h2{font-size:1.7rem;margin-bottom:14px}h3{font-size:1.05rem;margin-bottom:8px}
.mut{color:var(--mut)}
button,input,select{font:inherit;color:inherit}
textarea{font:inherit;color:inherit}
input,select,textarea{background:var(--sf);border:1.5px solid var(--ln);border-radius:6px;padding:9px 11px;width:100%;min-width:0}
label{display:grid;gap:4px;font-weight:600;font-size:.9rem}
.btn{background:var(--br);color:var(--bi);border:0;border-radius:6px;padding:9px 16px;font-weight:600;cursor:pointer}
.btn.ghost{background:none;color:var(--ink);border:1.5px solid var(--ln)}
.btn.sm{padding:5px 10px;font-size:.85rem}.btn.del{background:none;color:var(--bad);border:1.5px solid var(--ln)}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
/* login */
.login{min-height:100vh;display:grid;grid-template-columns:1.1fr 1fr}
.hero{background:linear-gradient(160deg,#1c3f35,#0f221c);color:var(--bd);padding:clamp(28px,6vw,80px);display:flex;flex-direction:column;justify-content:center;gap:18px}
.hero h1{font-size:clamp(2.2rem,5vw,4rem);font-weight:800}
.hero p{max-width:44ch;opacity:.9}
.crest{width:68px;height:68px;border-radius:50%;border:3px solid var(--ac);display:grid;place-items:center;font:800 1.25rem var(--hd);color:var(--ac);letter-spacing:.04em}
.hero .eyebrow{letter-spacing:.22em;text-transform:uppercase;font-size:.85rem;color:var(--ac);font-weight:600;opacity:1;margin-bottom:-8px}
.chips2{display:flex;flex-wrap:wrap;gap:8px}.chips2 span{border:1px solid rgba(255,255,255,.3);border-radius:99px;padding:4px 14px;font-size:.85rem}
.demo{border-left:4px solid var(--ac);padding-left:14px;display:grid;gap:3px;font-size:.92rem}
.demo b{font-family:var(--hd)}
.lf{padding:clamp(24px,5vw,70px);display:flex;flex-direction:column;justify-content:center;gap:16px;max-width:460px;width:100%;margin:auto}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border:1.5px solid var(--ln);border-radius:8px;overflow:hidden}
.tabs button{background:none;border:0;padding:10px;font-weight:600;cursor:pointer}
.tabs button.on{background:var(--br);color:var(--bi)}
.err{color:var(--bad);font-weight:600}
/* app */
.shell{display:grid;grid-template-columns:240px 1fr;min-height:100vh}
.side{background:var(--board);color:var(--bd);padding:20px 14px;display:flex;flex-direction:column;gap:6px}
.side h3{margin:0 0 2px}.side .who{opacity:.75;font-size:.85rem;margin-bottom:14px}
.side button{background:none;border:0;color:inherit;text-align:left;padding:10px 12px;border-radius:6px;cursor:pointer}
.side button.on{background:rgba(255,255,255,.12);box-shadow:inset 3px 0 var(--ac)}
.side .out{margin-top:auto;border:1.5px solid rgba(255,255,255,.3)}
.main{padding:clamp(16px,3vw,36px);min-width:0}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi,.card{background:var(--sf);border:1px solid var(--ln);border-radius:8px;padding:14px 16px}
.kpi b{display:block;font:800 1.8rem var(--hd)}.kpi span{color:var(--mut);font-size:.9rem}
.card{margin-bottom:16px;box-shadow:0 1px 2px rgba(20,48,42,.06)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.row>*{flex:1 1 150px}.row>.btn{flex:0 0 auto}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.95rem}
th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--ln);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:.85rem}
.pill{border:0;border-radius:99px;padding:4px 14px;font-weight:600;cursor:pointer;background:var(--ln)}
.pill.p{background:var(--ok);color:#fff}.pill.a{background:var(--bad);color:#fff}
.tag{padding:2px 10px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--ln)}
.tag.ok{background:var(--ok);color:#fff}.tag.bad{background:var(--bad);color:#fff}
.bars{display:flex;align-items:flex-end;gap:14px;height:150px;padding-top:8px}
.bars div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:4px;font-size:.85rem}
.bars i{width:100%;max-width:60px;background:var(--br);border-radius:4px 4px 0 0;min-height:3px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.chips span{border:1.5px solid var(--ln);border-radius:99px;padding:3px 6px 3px 12px;display:inline-flex;gap:6px;align-items:center}
.chips button{background:none;border:0;cursor:pointer;color:var(--bad);font-weight:700}
.note{border-left:4px solid var(--ac);padding:8px 12px;margin-bottom:10px;background:var(--sf)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:20px}
.modal{background:var(--sf);border-radius:10px;padding:24px;max-width:380px;width:100%;display:grid;gap:8px}
.av{border-radius:50%;object-fit:cover;background:var(--br);color:var(--bi);display:inline-grid;place-items:center;font-family:var(--hd);font-weight:700;vertical-align:middle;flex:none}
.prof{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center;background:var(--sf);border:1px solid var(--ln);border-top:4px solid var(--ac);border-radius:10px;padding:22px;margin-bottom:16px;box-shadow:0 1px 2px rgba(20,48,42,.06)}
.prof h2{margin:0 0 2px}
.greet{margin-bottom:18px}.greet h2{margin-bottom:2px}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px 28px;margin-top:16px;padding-top:14px;border-top:1px solid var(--ln)}
.det span{display:block;font-size:.78rem;color:var(--mut)}.det b{font-weight:600}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:14px;margin-bottom:20px;border-bottom:1px solid var(--ln)}
.top>div:first-child{display:grid}.top b{font-family:var(--hd);font-size:1.05rem}.chip{display:flex;align-items:center;gap:10px;font-weight:600}
@media (max-width:800px){.prof{grid-template-columns:1fr;justify-items:start}.login,.shell{grid-template-columns:1fr}.side{flex-direction:row;flex-wrap:wrap;align-items:center}.side .who{display:none}.side .out{margin:0 0 0 auto}.hero{padding:28px}}
.side{background:linear-gradient(180deg,#1c3f35,#0f221c)}
.side button{display:flex;gap:10px;align-items:center}.side button span{width:1.4em;text-align:center}
.side h3{font-size:1.15rem;padding:4px 12px 14px;border-bottom:1px solid rgba(255,255,255,.15);margin-bottom:8px}
.kpi{border-top:3px solid var(--ac)}.kpi.lnk{text-align:left;cursor:pointer;color:inherit;font:inherit;width:100%}.kpi.lnk:hover{border-color:var(--br);box-shadow:0 4px 14px rgba(20,48,42,.12)}
.card{border-radius:10px;transition:box-shadow .15s}.card:hover{box-shadow:0 4px 14px rgba(20,48,42,.1)}
th{text-transform:uppercase;letter-spacing:.04em;font-size:.72rem}tbody tr:hover{background:rgba(31,90,71,.07)}
.top{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:12px 16px}
.main{max-width:1240px}.btn{transition:filter .15s}.btn:hover{filter:brightness(1.1)}
.main>h2{padding-left:12px;border-left:5px solid var(--ac)}
.foot{margin-top:28px;padding-top:14px;border-top:1px solid var(--ln);color:var(--mut);font-size:.9rem}.foot a{color:var(--br);font-weight:600}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}.chart svg{width:100%;height:auto;display:block}
.ct{fill:var(--mut);font:11px var(--tx)}.cv{fill:var(--ink);font:600 11px var(--tx)}.gl{stroke:var(--ln);stroke-width:1}
.lg{display:flex;gap:16px;flex-wrap:wrap;font-size:.85rem;margin-top:10px;color:var(--mut)}.lg i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.lgb{background:none;border:1.5px solid var(--ln);border-radius:99px;padding:3px 12px;cursor:pointer;color:var(--ink);font:inherit;font-size:.85rem;display:inline-flex;align-items:center}.lgb:hover{border-color:var(--br)}
.pw{position:relative;display:block}.pw input{padding-right:46px}
.eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);background:none;border:0;cursor:pointer;color:var(--mut);padding:6px;display:grid;place-items:center}.eye:hover{color:var(--ink)}.eye svg{width:20px;height:20px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;box-shadow:0 2px 8px rgba(20,48,42,.08)}
.tl{display:flex;align-items:center;gap:12px}.tt{display:grid}
.tbr{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.tb{display:inline-flex;align-items:center;gap:6px;background:none;border:1.5px solid var(--ln);border-radius:99px;padding:6px 12px;cursor:pointer;color:var(--ink);font:inherit;font-size:.9rem}.tb:hover,.tb.on{border-color:var(--br);background:rgba(31,90,71,.1)}
.burger{background:var(--br);color:var(--bi);border:0;border-radius:8px;width:40px;height:40px;display:grid;place-items:center;cursor:pointer;flex:none}.burger svg{width:22px;height:22px}
.shell.solo{grid-template-columns:1fr}
.side.drawer{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:50;transform:translateX(-105%);transition:transform .2s;overflow-y:auto;flex-direction:column;flex-wrap:nowrap;align-items:stretch;padding-top:calc(20px + env(safe-area-inset-top,0px))}
.side.drawer.open{transform:none;box-shadow:6px 0 24px rgba(0,0,0,.35)}
.side.drawer .who{display:block}.side.drawer .out{margin:auto 0 0}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:40}
@media (max-width:800px){.tb .tbl{display:none}.tb{padding:8px 10px}}
@media (prefers-reduced-motion:reduce){.side.drawer{transition:none}}
.side .xbtn{position:absolute;top:calc(10px + env(safe-area-inset-top,0px));right:10px;width:38px;height:38px;padding:0;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:none;color:inherit;cursor:pointer;display:grid;place-items:center}.side .xbtn:hover{border-color:var(--ac)}.xbtn svg{width:20px;height:20px}
.side.drawer h3{padding-right:48px}
.mut a{color:var(--br);font-weight:600}
a.btn{display:inline-block;text-decoration:none}
.livebtn{display:flex;justify-content:space-between;align-items:center;width:100%;background:none;border:0;color:inherit;font:inherit;text-align:left;cursor:pointer;padding:0}
.livegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}.live{border:1.5px solid var(--ln);border-left:5px solid var(--ln);border-radius:10px;padding:12px 14px;display:grid;gap:2px}.live span{color:var(--mut);font-size:.85rem}.live em{font-style:normal;font-weight:600;color:var(--mut)}.live.lp{border-left-color:var(--ok)}.live.lp em{color:var(--ok)}.live.la{border-left-color:var(--bad)}.live.la em{color:var(--bad)}
.pbar{height:10px;background:var(--ln);border-radius:99px;overflow:hidden}.pbar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--br),var(--ac))}
.hl{paint-order:stroke;stroke:var(--sf);stroke-width:4px;fill:var(--ink);font:600 11px var(--tx)}
@media print{.side,.btn{display:none}.ov{position:static;background:none}}

/* ---------- mobile responsive layout fix ---------- */
html, body, #app { width:100%; max-width:100%; }
body { overflow-x:clip; }
.shell, .main, .top, .tl, .tt, .tbr, .card, .kpi, .prof { min-width:0; }
.top > *, .tbr > * { min-width:0; }
img, svg, canvas { max-width:100%; }
.charts { grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr)); }
.livegrid { grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr)); }

@media (max-width:800px) {
  .shell { grid-template-columns:minmax(0,1fr); }
  .main { width:100%; max-width:100%; padding:16px; }
  .side:not(.drawer) { width:100%; min-width:0; flex-direction:row; flex-wrap:wrap; }
  .side:not(.drawer) button { min-width:0; }
  .side:not(.drawer) .out { margin-left:auto; }
  .login { grid-template-columns:minmax(0,1fr); }
  .hero { padding:28px; }
  .lf { max-width:100%; }
  .prof { grid-template-columns:minmax(0,1fr); justify-items:start; gap:16px; }
  .det { grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr)); gap:12px; }
  .charts { grid-template-columns:minmax(0,1fr); }
}

@media (max-width:600px) {
  .main { padding:10px; }
  .top {
    position:relative;
    display:flex;
    flex-direction:column;
    align-items:stretch;
    gap:12px;
    width:100%;
    padding:12px;
    margin-bottom:14px;
  }
  .tl { width:100%; gap:10px; }
  .tt { min-width:0; flex:1 1 auto; }
  .tt b { font-size:1rem; overflow-wrap:anywhere; }
  .tt .mut { font-size:.82rem; overflow-wrap:anywhere; }
  .tbr { width:100%; justify-content:flex-start; gap:6px; }
  .tb { flex:0 0 auto; padding:7px 9px; }
  .chip { margin-left:auto; min-width:0; max-width:100%; gap:6px; }
  .chip span { max-width:120px; overflow-wrap:anywhere; }
  .kpis { grid-template-columns:minmax(0,1fr); gap:10px; }
  .kpi, .card { min-width:0; padding:13px; }
  .kpi b { font-size:1.55rem; overflow-wrap:anywhere; }
  .row { align-items:stretch; }
  .row > * { min-width:0; flex:1 1 100%; }
  .row > .btn { flex:1 1 auto; }
  .prof { padding:14px; }
  .det { grid-template-columns:minmax(0,1fr); }
  .livegrid { grid-template-columns:minmax(0,1fr); }
  .charts { grid-template-columns:minmax(0,1fr); }
  .hero { padding:22px 18px; }
  .lf { padding:22px 18px; }
  .tabs { grid-template-columns:repeat(3,minmax(0,1fr)); }
  .tabs button { padding:8px 4px; }
  h2 { font-size:1.45rem; }
  .tw { width:100%; max-width:100%; overflow-x:auto; -webkit-overflow-scrolling:touch; }
  .card, .kpi, .note, .modal { overflow-wrap:anywhere; }
  .chips { max-width:100%; }
  .chips span { max-width:100%; }
}

</style>
